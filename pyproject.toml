[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contentmaxxer"
version = "0.4.0"
description = "Source-grounded, Manim-first social content production"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Pillow>=10.0",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
animation = [
  "manim>=0.19,<0.20",
  "importlib-metadata>=6,<9; python_version<'3.10'",
]
local-voice = [
  "chatterbox-tts>=0.1.2; python_version>='3.10'",
]
qwen3-mlx = [
  "mlx-audio>=0.4.6; sys_platform=='darwin' and platform_machine=='arm64' and python_version>='3.10'",
]

[project.scripts]
contentmaxxer = "contentmaxxer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
