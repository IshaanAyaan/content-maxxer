[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-maxxer"
version = "0.1.0"
description = "Prompt-to-shortform video workflow for Manim explainers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "arxiv>=2.1.3",
  "manim>=0.19.0",
  "matplotlib>=3.8.0",
  "moviepy>=1.0.3",
  "numpy>=1.26.0",
  "pillow>=10.0.0",
  "pydub>=0.25.1",
  "pymupdf>=1.24.0",
  "pypdf>=4.0.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "scipy>=1.11.0"
]

[project.scripts]
content-maxxer = "content_maxxer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
